<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rand-Q</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Edu+VIC+WA+NT+Hand:wght@400..700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#121314] text-white text-center min-h-[80vh] grid content-center">
    <noscript>
      <div class="error">
          <div class="error__icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" viewBox="0 0 24 24" height="24" fill="none"><path fill="#393a37" d="m13 13h-2v-6h2zm0 4h-2v-2h2zm-1-15c-1.3132 0-2.61358.25866-3.82683.7612-1.21326.50255-2.31565 1.23915-3.24424 2.16773-1.87536 1.87537-2.92893 4.41891-2.92893 7.07107 0 2.6522 1.05357 5.1957 2.92893 7.0711.92859.9286 2.03098 1.6651 3.24424 2.1677 1.21325.5025 2.51363.7612 3.82683.7612 2.6522 0 5.1957-1.0536 7.0711-2.9289 1.8753-1.8754 2.9289-4.4189 2.9289-7.0711 0-1.3132-.2587-2.61358-.7612-3.82683-.5026-1.21326-1.2391-2.31565-2.1677-3.24424-.9286-.92858-2.031-1.66518-3.2443-2.16773-1.2132-.50254-2.5136-.7612-3.8268-.7612z"></path></svg>
          </div>
          <div class="error__title">Включите JavaScript иначе сайт не будет работать!</div>
      </div>
      <style>
      .error {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        width: 320px;
        padding: 12px;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: start;
        background: #EF665B;
        border-radius: 8px;
        box-shadow: 0px 0px 5px -3px #111;
      }
      
      .error__icon {
        width: 20px;
        height: 20px;
        transform: translateY(-2px);
        margin-right: 8px;
      }
      
      .error__icon path {
        fill: #fff;
      }
      
      .error__title {
        font-weight: 500;
        font-size: 14px;
        color: #fff;
      }
      </style>
    </noscript>
    <h1 class="font-['Edu_VIC_WA_NT_Hand'] font-normal not-italic text-7xl " id="logo">Rand-Q</h1>
    <h1 class="text-3xl mb-5 font-['Caveat'] font-normal not-italic mb-5">Найдите всё что вам нужно</h1>
    <div class="bg-gray-800 w-fit p-4 rounded-2xl mx-auto ">
       <input type="search" id="query" placeholder="Введите ваш запрос" class="bg-gray-700 rounded-full p-4 text-white min-w-[40vw] max-w-2xl shadow-[inset_0_2px_8px_rgba(255,0,94,0.15)]"> 
       <input type="submit" id="myButton" class="bg-gray-600 p-3 rounded-xl shadow-lg hover:bg-gray-900 active:scale-80 " value="Search"> 
    </div>
    <style>
                /* Делает крестик белым в Chrome, Safari, Edge */
        input[type="search"]::-webkit-search-cancel-button {
        filter: invert(1); /* Инвертирует черный цвет в белый */
        }
        #logo{animation: glow 1s infinite alternate;}
        @keyframes glow {
            from {
                text-shadow: 0 0 5px #ff005e, 0 0 10px #ff005e, 0 0 20px #ff005e;
            }
            to {
                text-shadow: 0 0 10px #ff005e, 0 0 20px #ff005e, 0 0 40px #ff005e, 0 0 80px #ff005e;
            }
        }

    </style>
    <script src="script.js"></script>
</body>
</html>
